openapi: 3.0.0
info:
  title: Modello Dati - Scheda ID - Scheda  per l'integrazione dei dati non essenziali ai fini della pubblicità legale e del flusso della procedura.
  description: | 
    In caso di modifica dei cup le operazioni consentite sono:\
    INSERIMENTO: La lista dei CUP attualmente associati al CIG viene completamente sostituita. Viene quindi eliminata la lista esistente e impostata una nuova lista, pari ai valori indicati nel campo CUP della scheda.\
    RIMOZIONE: Viene eliminata la lista esistente. In questo caso il campo CUP NON deve essere valorizzato.\
    \
    La scheda permette la modifica del ribasso di aggiudicazione solo in caso di omessa comunicazione in fase di affidamento.\
    \
    Con questa scheda può essere comunicata anche l'informazione relativa al docFAP, ovvero se è stato realizzato e autorizzato entro i termini lo studio di fattibilità che esenta dall'uso del BIM.\
    \
    Possono inoltre essere integrate alcune informazioni relative ai dati del contratto.\
    I campi della sezione IntegrazioneDatiEsecuzioneType verranno aggiornati solo se non comunicati in precedenza con la scheda SC1 (per la dataStipula) o in caso di mancato invio della scheda I1.\
    La scheda ID potrà essere inviata più volte con la sezione IntegrazioneDatiEsecuzioneType compilata, in caso si vogliano comunicare i dati in momenti diversi, ma non sarà possibile correggere i dati già trasmessi.\
    L'aggiornamento avverrà solo se il dato non è stato comunicato in precedenza.\
    \
    La scheda permette infine di modificare l'indirizzo dei documenti di gara    
  version: 1.0.0
components:
  schemas:
    IntegrazioneDatiEsecuzioneType:
      description: Dati inerenti l'inizio dell'esecuzione lavori
      type: object
      required: [motivoIntegrazione,idContratto]
      additionalProperties: false
      properties:
        motivoIntegrazione:
            $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/MotivoIntegrazioneEnum'
        idContratto: 
          description: id contratto
          type: string  
          format: uuid
          example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6"
        dataStipulaContratto:
          description: Data stipula del contratto (A date-time specified by ISO 8601 as profiled by RFC 3339, with explicit UTC offset)
          allOf:
            - $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/modello-dati-tipologiche.yaml#/components/schemas/DataOraType'
        consegnaSottoRiserva:
          description: Consegna sotto riserva di legge?
          type: boolean
        dataEffettivoInizioPrestazione:
          description: Data di effettivo inizio lavori/servizi/forniture (consegna completa/avvio di tutte le prestazioni del contratto) (A date-time specified by ISO 8601 as profiled by RFC 3339, with explicit UTC offset)
          allOf:
            - $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/modello-dati-tipologiche.yaml#/components/schemas/DataOraType'
        dataFinePrevistaPrestazione:
          description: Data fine prevista per dare ultimazione ai lavori/servizi/forniture (A date-time specified by ISO 8601 as profiled by RFC 3339, with explicit UTC offset)
          allOf:
            - $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/modello-dati-tipologiche.yaml#/components/schemas/DataOraType'
    ComunicazioneCUPType:
      description: Dati inerenti la modifica del CUP
      type: object
      required: [operazioneCUP,motivoVariazioneCUP]
      additionalProperties: false
      properties:
        operazioneCUP:
          description: tipo di operazione
          type: string
          enum: ['INSERIMENTO', 'RIMOZIONE'] 
        motivoVariazioneCUP:
            $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/MotivoVariazioneCUPEnum'    
        cup:
          description: Cup
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9]{15}$
    ComunicazioneRibassoAggiudicazioneType:
      description: Dati inerenti la comunicazione del ribasso di aggiudicazione
      type: object
      required: [idPartecipante, motivoCorrezione,ribassoAggiudicazione]
      additionalProperties: false
      properties:
        idPartecipante: 
          description: id partecipante
          type: string  
          format: uuid
          example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6"   
        motivoCorrezione:
            $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/MotivoCorrezioneEnum'    
        ribassoAggiudicazione:
          description: ribasso di aggiudicazione. valori ammessi-> (x<100); sono ammessi valori negativi. I valori positivi saranno considerati come integrazione del campo offertePresentate.offertaEconomica, mentre i valori negativi andranno ad integrare il campo offertePresentate.offertaInAumento.
          type: number
          format: double
          maximum: 100
          exclusiveMaximum: true
    ComunicazioneUrlType:
      description: Dati inerenti la modifica dell'indirizzo dei documenti di gara'
      type: object
      required: [motivoCorrezioneUrl,url]
      additionalProperties: false
      properties:
        motivoCorrezioneUrl:
            $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/MotivoCorrezioneUrlEnum'    
        url:
          description: Indirizzo dei documenti di gara.
          type: string
          format: url         
    ComunicazioneIDType:
      type: object
      required: [motivoRichiestaModifica]
      additionalProperties: false
      properties:
        motivoRichiestaModifica:
            $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/MotivoRichiestaModificaEnum'    
        comunicazioneCUP:
            $ref: '#/components/schemas/ComunicazioneCUPType'
        comunicazioneRibassoAggiudicazione:
            $ref: '#/components/schemas/ComunicazioneRibassoAggiudicazioneType'
        docFAP:
          description: è stato realizzato e autorizzato entro i termini lo studio di fattibilità che esenta dall'uso del BIM
          type: boolean
        comunicazioneUrl:
            $ref: '#/components/schemas/ComunicazioneUrlType'
        integrazioneDatiEsecuzione:
            $ref: '#/components/schemas/IntegrazioneDatiEsecuzioneType'
    AnacFormIDType:
      type: object
      required: [cig,comunicazione]
      additionalProperties: false
      properties:
        cig:
          description: codice identificativo lotto
          type: string 
        comunicazione:
            $ref: '#/components/schemas/ComunicazioneIDType'    
    SchedaIDType:
      description: Scheda  per l'integrazione dei dati non essenziali ai fini della pubblicità legale e del flusso della procedura.
      type: object
      required: [anacForm]
      additionalProperties: false
      properties:
        anacForm:
          $ref: '#/components/schemas/AnacFormIDType'
