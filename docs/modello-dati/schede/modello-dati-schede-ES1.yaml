openapi: 3.0.0
info:
  title: Modello Dati - Scheda ES1 - Scheda di esito subappalto.
  description: | 
    La scheda ES1 chiude la fase autorizzativa del subappalto richiesto con la scheda RSU1 e ne determina il nuovo stato.\
    Il campo idScheda deve riportare l'identificativo restituito all'invio della scheda RSU1 di richiesta: la scheda può essere correlata unicamente a una scheda RSU1 riferita allo stesso appalto e allo stesso contratto.\
    In funzione di come viene valorizzata la scheda, lo stato del subappalto evolve come segue: con la data di autorizzazione il subappalto passa in stato Autorizzato; con il motivo di mancato subappalto valorizzato come Mancata approvazione il subappalto passa in stato Non approvato; con il motivo di mancato subappalto valorizzato come Revoca della richiesta di subappalto il subappalto passa in stato Revocato.\
    Solo uno dei due dati - data di autorizzazione del subappalto oppure motivo del mancato subappalto - deve essere valorizzato: una scheda che non riporta nessuno dei due è priva dell'esito da comunicare e non viene accettata dal sistema.\
    I due dati sono inoltre alternativi tra loro: va valorizzato unicamente quello coerente con l'esito che si intende comunicare, e non entrambi.\
    Solo un subappalto autorizzato consente le lavorazioni successive: la conclusione del subappalto con la scheda CS1 o il conferimento di un ulteriore subappalto a cascata con una nuova scheda RSU1. Per un subappalto non approvato o revocato il ciclo si intende concluso e non sono previste ulteriori comunicazioni.\
    L'invio di più schede ES1 riferite alla stessa richiesta di subappalto non è una lavorazione prevista: lo stato del subappalto risulterebbe determinato dall'ultima scheda confermata.
  version: 1.0.0
components:
  schemas:
    SubappaltoType:
      description: Dati relativi ai subappalti
      type: object
      additionalProperties: false
      properties:    
        dataAutorizzazione: 
          description: Data di autorizzazione del subappalto
          type: string
          format: date-time
        motivoMancatoSubappalto: 
          $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/MotivoMancatoSubappaltoEnum'
    AnacFormES1Type:
      description: Contiene tutti i dati relativi alla scheda di Richiesta di Subappalto
      type: object
      required: [subappalto, idScheda]
      additionalProperties: false
      properties: 
        idScheda:
          description: identificativo restituito dal servizio all’invio della scheda di richiesta di subappalto.
          type: string   
          format: uuid
          example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6"      
        subappalto:
          $ref: '#/components/schemas/SubappaltoType'
    SchedaES1Type:
      description: Esito Richiesta subappalto. Autorizzazione/diniego subappalto. Articolo119 decreto legislativo 36/2023
      type: object
      required: [anacForm]
      additionalProperties: false
      properties:
        anacForm:
          $ref: '#/components/schemas/AnacFormES1Type'