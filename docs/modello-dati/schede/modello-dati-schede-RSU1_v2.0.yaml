openapi: 3.0.0
info:
  title: Modello Dati - Scheda RSU1 - Scheda di richiesta di subappalto.
  description: | 
    La scheda RSU1 apre il ciclo di vita di un subappalto: ogni scheda confermata determina la creazione a sistema di un nuovo subappalto, agganciato al contratto indicato in idContratto e posto nello stato Richiesto.\
    L'identificativo restituito dal servizio all'invio della scheda identifica il subappalto così creato e deve essere riportato nel campo idScheda della successiva scheda ES1 di esito.\
    La scheda deve essere inviata secondo il modello dati previsto dalla presente versione: le richieste di subappalto trasmesse secondo il precedente modello dati non sono lavorate dal sistema.\
    Più schede RSU1 possono essere inviate sullo stesso contratto: ciascuna dà luogo a un subappalto distinto, con un proprio ciclo autorizzativo e di conclusione.\
    Conferente del subappalto - deve essere indicato uno solo dei due riferimenti disponibili: idAggiudicatario, se il subappalto è conferito dall'aggiudicatario del contratto, oppure idSubappaltanteACascata, se il subappalto è conferito da un soggetto che è a sua volta subappaltatore (subappalto a cascata). Il sistema attribuisce di conseguenza il ruolo del conferente nel contratto.\
    Se valorizzato idAggiudicatario, il soggetto indicato deve essere un partecipante effettivamente aggiudicatario di un lotto del contratto: non è possibile indicare come conferente un partecipante non aggiudicatario.\
    Subappalto a cascata - occorre valorizzare anche idSubappalto con l'identificativo restituito dalla scheda RSU1 del subappalto di livello superiore, dal quale il nuovo subappalto discende. Il sistema ammette il subappalto a cascata solo se il subappalto di livello superiore risulta autorizzato: non è possibile agganciare un subappalto a cascata a un subappalto ancora soltanto richiesto, non approvato, revocato, annullato o già concluso.\
    Sempre nel caso di subappalto a cascata, il soggetto indicato in idSubappaltanteACascata deve coincidere con il subappaltatore del subappalto di livello superiore: non è possibile far discendere il nuovo subappalto da un soggetto estraneo a quella catena.\
    I codici fiscali dei soggetti indicati come subappaltatore sono sottoposti alle verifiche di esistenza e validità previste per le persone giuridiche.\
    L'evoluzione del subappalto richiesto si governa attraverso le successive schede ES1 e CS1.
  version: 1.0.0
components:
  schemas:
    SoggettoType:
      description: Dati del soggetto
      type: object
      additionalProperties: false
      required: [codiceFiscale,denominazione,ruoloOE,tipoOE,operatoreEstero]
      properties:
        codiceFiscale:
          description: Codice fiscale
          type: string
        denominazione: 
          description: Denominazione
          type: string  
        ruoloOE: 
          $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/RuoloOEEnum'
        tipoOE: 
          $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/TipoOEEnum'
        operatoreEstero: 
          type: boolean
        
    OperatoreEconomicoType:
      description: Dati del subappaltatore
      type: object
      additionalProperties: false
      required: [elencoSoggetti,idOE]
      properties:
        idOE: 
          description: id operatore economico
          type: string  
          format: uuid
          example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6"
        elencoSoggetti:
          type: array
          items:
            $ref: '#/components/schemas/SoggettoType'
    ConferenteSubappaltoType:
      description: Dati del conferente
      type: object
      additionalProperties: false
      properties:
        idAggiudicatario:
          description: id partecipante dell'aggiudicatario che conferisce il subappalto
          type: string  
          format: uuid
          example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6" 
        idSubappaltanteACascata:
          description: idOE conferente subappalto in caso di subappalto a cascata
          type: string  
          format: uuid
          example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6" 
    SubappaltoType:
      description: Dati relativi ai subappalti
      type: object
      required: [operatoreEconomicoSubappaltatore,conferenteSubappalto,importoPresunto,categoria,cpv]
      additionalProperties: false
      properties:    
        operatoreEconomicoSubappaltatore:
         $ref: '#/components/schemas/OperatoreEconomicoType'
        conferenteSubappalto:
          $ref: '#/components/schemas/ConferenteSubappaltoType'
        oggetto:
          description: Lavoro/Servizio/Fornitura subappalto
          type: string
        oggettoMl:
          $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/MultilinguaType'         
        importoPresunto:
          description: Importo presunto Lavoro/ Servizio/Fornitura, subappalto
          type: number
          format: double
        categoria:
          $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/CategoriaEnum' 
        categoriaScorporabile:
          type: array
          items:
            $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/CategoriaEnum'          
        cpv:
          type: array
          items:
            $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/CPVEnum'   
    AnacFormRSU1Type:
      description: Contiene tutti i dati relativi alla scheda di Richiesta di Subappalto
      type: object
      required: [subappalto,idContratto]
      additionalProperties: false
      properties: 
        idContratto:
          description: identificativo del contratto restituito in response alla scheda di Sottoscrizione del contratto.
          type: string   
          format: uuid
          example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6" 
        idSubappalto:
          description: identificativo restituito dal servizio all’invio della scheda di richiesta di subappalto precedente, obbligatorio in caso di subappalto a cascata.
          type: string   
          format: uuid
          example: "f81d4fae-7dec-11d0-a765-00a0c91e6bf6"
        subappalto:
          $ref: '#/components/schemas/SubappaltoType'
    SchedaRSU1Type:
      description: Comunicazione richiesta di subappalto per qualunque procedura. Articolo 119 decreto legislativo 36/2023
      type: object
      required: [anacForm,espd]
      additionalProperties: false
      properties:
        anacForm:
          $ref: '#/components/schemas/AnacFormRSU1Type'
        espd:
         $ref: 'https://raw.githubusercontent.com/anticorruzione/npa/main/docs/modello-dati/schede/modello-dati-schede-dati-comuni.yaml#/components/schemas/EspdRequestType'            